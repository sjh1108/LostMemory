# website-nginx — tools/infra/nginx 의 /notice/ proxy 대상.
# 외부 노출 X (infra_public network 안에서만 접근).
server {
    listen      80 default_server;
    server_name _;

    # 모니터링/헬스체크 (tools/infra/nginx 에서 wget 으로 확인)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
}
