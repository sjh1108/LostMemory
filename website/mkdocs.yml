site_name: LostMemory
site_url: https://lostmemory.duckdns.org/
site_description: LostMemory 게임 공식 사이트 — 공지 / 패치노트 / FAQ
site_author: LostMemory Team
docs_dir: docs

theme:
  name: material
  language: ko
  palette:
    scheme: slate
    primary: deep purple
    accent: amber
  font: false
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - 홈: index.md
  - 공지사항: notices.md
  - 패치노트: patch-notes.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details

# sub-path 호스팅이 아니라 root 직접 호스팅이지만,
# 절대 경로 일관성과 nginx try_files 호환을 위해 false 명시.
use_directory_urls: false
