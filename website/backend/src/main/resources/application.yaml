spring:
  application:
    name: lostmemory-website
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: ${THYMELEAF_CACHE:true}

server:
  port: ${SERVER_PORT}
  servlet:
    session:
      timeout: 30m

management:
  endpoints:
    web:
      exposure:
        include: health

# AdminSeedRunner 가 부팅 시 admin_user 테이블에 username 이 없으면 BCrypt hash + insert.
# 운영 .env 의 ADMIN_PASSWORD 가 첫 부팅 시점의 초기 비밀번호.
admin:
  seed:
    username: ${ADMIN_USERNAME}
    password: ${ADMIN_PASSWORD}

# Admin URL obscure path — surface 축소용. .env 의 ADMIN_BASE_PATH 운영자 임의값.
# silent fallback X (envvar 정책 준수, .env 누락 시 BindException 강제 fail).
app:
  admin:
    base-path: ${ADMIN_BASE_PATH}

logging:
  level:
    org.springframework.security: INFO
    org.hibernate.SQL: INFO
