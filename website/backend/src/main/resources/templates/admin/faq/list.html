<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('FAQ 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: admin-bar}"></div>

<main class="site-main">
  <h2>FAQ 관리</h2>

  <div th:if="${message}" class="flash" th:text="${message}"></div>

  <p><a th:href="@{/admin/faqs/new}">+ 새 FAQ 추가</a></p>

  <table class="admin-table">
    <thead>
      <tr><th>ID</th><th>질문</th><th>순서</th><th>공개</th><th>액션</th></tr>
    </thead>
    <tbody>
      <tr th:each="f : ${faqs}">
        <td th:text="${f.id}">1</td>
        <td><a th:href="@{/admin/faqs/{id}/edit(id=${f.id})}" th:text="${f.question}">질문</a></td>
        <td th:text="${f.sortOrder}">0</td>
        <td th:text="${f.published} ? '공개' : '비공개'">공개</td>
        <td>
          <form th:action="@{/admin/faqs/{id}/delete(id=${f.id})}" method="post" style="display:inline" onsubmit="return confirm('삭제하시겠습니까?')">
            <button type="submit" class="btn-danger">삭제</button>
          </form>
        </td>
      </tr>
      <tr th:if="${faqs.isEmpty()}">
        <td colspan="5" class="entry-meta" style="text-align:center">등록된 FAQ가 없습니다.</td>
      </tr>
    </tbody>
  </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
