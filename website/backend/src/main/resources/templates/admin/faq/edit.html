<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${faqId == null ? '새 FAQ' : 'FAQ 편집'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: admin-bar}"></div>

<main class="site-main">
  <h2 th:text="${faqId == null ? '새 FAQ 추가' : 'FAQ 편집'}">FAQ</h2>

  <form th:action="${faqId == null} ? @{/admin/faqs} : @{/admin/faqs/{id}(id=${faqId})}"
        method="post" th:object="${form}" class="admin-form">
    <div>
      <label for="question">질문</label>
      <input type="text" id="question" th:field="*{question}" maxlength="500" required>
      <div class="field-error" th:if="${#fields.hasErrors('question')}" th:errors="*{question}"></div>
    </div>
    <div>
      <label for="answer">답변 (Markdown 또는 plain text)</label>
      <textarea id="answer" th:field="*{answer}" required></textarea>
      <div th:replace="~{fragments/markdown-hint :: hint}"></div>
      <div class="field-error" th:if="${#fields.hasErrors('answer')}" th:errors="*{answer}"></div>
    </div>
    <div>
      <label for="categoryId">카테고리 (비워두면 미분류)</label>
      <select id="categoryId" th:field="*{categoryId}">
        <option value="">(미분류)</option>
        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}">카테고리</option>
      </select>
      <div class="field-error" th:if="${#fields.hasErrors('categoryId')}" th:errors="*{categoryId}"></div>
    </div>
    <div>
      <label for="sortOrder">정렬 순서 (낮을수록 위)</label>
      <input type="number" id="sortOrder" th:field="*{sortOrder}" min="0" required>
      <div class="field-error" th:if="${#fields.hasErrors('sortOrder')}" th:errors="*{sortOrder}"></div>
    </div>
    <div>
      <label>
        <input type="checkbox" th:field="*{published}"> 공개
      </label>
    </div>
    <div>
      <input type="submit" value="저장">
      <a th:href="@{/admin/faqs}" style="margin-left:1rem">취소</a>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
