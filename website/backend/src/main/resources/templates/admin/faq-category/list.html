<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('FAQ 카테고리 관리')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: admin-bar}"></div>

<main class="site-main">
  <h2>FAQ 카테고리 관리</h2>

  <div th:if="${message}" class="flash" th:text="${message}"></div>

  <p><a th:href="@{/admin/faq-categories/new}">+ 새 카테고리 추가</a></p>

  <table class="admin-table">
    <thead>
      <tr><th>ID</th><th>이름</th><th>순서</th><th>공개</th><th>액션</th></tr>
    </thead>
    <tbody>
      <tr th:each="c : ${categories}">
        <td th:text="${c.id}">1</td>
        <td><a th:href="@{/admin/faq-categories/{id}/edit(id=${c.id})}" th:text="${c.name}">카테고리</a></td>
        <td th:text="${c.sortOrder}">0</td>
        <td th:text="${c.published} ? '공개' : '비공개'">공개</td>
        <td>
          <form th:action="@{/admin/faq-categories/{id}/delete(id=${c.id})}" method="post" style="display:inline"
                onsubmit="return confirm('삭제하시겠습니까? 연결된 FAQ 는 미분류로 이동합니다.')">
            <button type="submit" class="btn-danger">삭제</button>
          </form>
        </td>
      </tr>
      <tr th:if="${categories.isEmpty()}">
        <td colspan="5" class="entry-meta" style="text-align:center">등록된 카테고리가 없습니다.</td>
      </tr>
    </tbody>
  </table>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
