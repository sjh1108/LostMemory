<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${categoryId == null ? '새 FAQ 카테고리' : 'FAQ 카테고리 편집'})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<div th:replace="~{fragments/layout :: admin-bar}"></div>

<main class="site-main">
  <h2 th:text="${categoryId == null ? '새 FAQ 카테고리 추가' : 'FAQ 카테고리 편집'}">FAQ 카테고리</h2>

  <form th:action="${categoryId == null} ? @{__${adminBase}__/faq-categories} : @{__${adminBase}__/faq-categories/{id}(id=${categoryId})}"
        method="post" th:object="${form}" class="admin-form">
    <div>
      <label for="name">이름</label>
      <input type="text" id="name" th:field="*{name}" maxlength="64" required>
      <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div>
      <label for="sortOrder">정렬 순서 (낮을수록 위)</label>
      <input type="number" id="sortOrder" th:field="*{sortOrder}" min="0" required>
      <div class="field-error" th:if="${#fields.hasErrors('sortOrder')}" th:errors="*{sortOrder}"></div>
    </div>
    <div>
      <label>
        <input type="checkbox" th:field="*{published}"> 공개
      </label>
    </div>
    <div>
      <input type="submit" value="저장">
      <a th:href="@{__${adminBase}__/faq-categories}" style="margin-left:1rem">취소</a>
    </div>
  </form>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
