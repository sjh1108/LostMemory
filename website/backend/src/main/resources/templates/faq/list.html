<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('FAQ')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="site-main">
  <h2>자주 묻는 질문 (FAQ)</h2>

  <div th:if="${!faqs.isEmpty()}">
    <details th:each="f : ${faqs}" style="margin-bottom:0.5rem;border:1px solid var(--border);padding:1rem;background:var(--panel)">
      <summary style="cursor:pointer;color:var(--accent)" th:text="${f.question}">질문</summary>
      <pre style="white-space:pre-wrap;margin-top:0.75rem;background:transparent;padding:0;color:var(--fg)" th:text="${f.answer}">답변</pre>
    </details>
  </div>
  <p th:if="${faqs.isEmpty()}" class="entry-meta">등록된 FAQ가 없습니다.</p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
