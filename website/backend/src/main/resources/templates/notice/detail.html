<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${notice.title})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>

<main class="site-main">
  <h2 th:text="${notice.title}">제목</h2>
  <div class="entry-meta" th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd HH:mm')}">날짜</div>
  <pre style="white-space:pre-wrap;margin-top:1rem;background:transparent;padding:0;color:var(--fg)" th:text="${notice.body}">본문</pre>

  <p style="margin-top:2rem"><a th:href="@{/notices}">← 목록으로</a></p>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
