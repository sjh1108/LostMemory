services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    command: >
      sh -c "envsubst '$$PUBLIC_DOMAIN $$COMFYUI_DOMAIN $$AI_BACKEND_UPSTREAM $$COMFYUI_UPSTREAM'
      < /etc/nginx/templates/ai-tool.conf.template
      > /etc/nginx/conf.d/ai-tool.conf
      && rm -f /etc/nginx/conf.d/default.conf
      && nginx -g 'daemon off;'"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      COMFYUI_DOMAIN: ${COMFYUI_DOMAIN}
      AI_BACKEND_UPSTREAM: ${AI_BACKEND_UPSTREAM}
      COMFYUI_UPSTREAM: ${COMFYUI_UPSTREAM}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_etc:/etc/letsencrypt:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public

  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    environment:
      TZ: ${TZ:-Asia/Seoul}
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN}
      COMFYUI_DOMAIN: ${COMFYUI_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-admin@example.com}
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    networks:
      - public

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Seoul}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - private

volumes:
  certbot_webroot:
  certbot_etc:
  postgres_data:

networks:
  public:
  private:
    internal: true

