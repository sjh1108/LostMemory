spring:
  application:
    name: ai-server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui/index.html

comfyui:
  base-url: ${COMFYUI_BASE_URL}
  output-dir: ${COMFYUI_OUTPUT_DIR:}
  models-dir: ${COMFYUI_MODELS_DIR:}
  loras-dir: ${COMFYUI_LORAS_DIR:}
  connect-timeout-ms: ${COMFYUI_CONNECT_TIMEOUT_MS:5000}
  read-timeout-seconds: ${COMFYUI_READ_TIMEOUT_SECONDS:30}
  history-poll-interval-ms: ${COMFYUI_HISTORY_POLL_INTERVAL_MS:1000}
  history-poll-timeout-seconds: ${COMFYUI_HISTORY_POLL_TIMEOUT_SECONDS:300}

database:
  postgres:
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    name: ${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

storage:
  s3:
    region: ${AWS_REGION}
    bucket: ${AWS_S3_BUCKET}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    signed-url-ttl-seconds: ${S3_SIGNED_URL_TTL_SECONDS:86400}

auth:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-seconds: ${JWT_EXPIRATION:3600}
