# 컨테이너 stdout/stderr 로그 회전 정책 — 모든 service 에 동일 적용.
# default 면 무한 누적이라 디스크 폭주 위험 → max 30MB/컨테이너 + gzip 압축.
# 호스트 default 는 /etc/docker/daemon.json 에서 별도 보호 (gitlab-runner 등 compose 외부 컨테이너용).
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
    compress: "true"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    # 외부 노출 X (내부 통신만)

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging

  app:
    image: server-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SERVER_PORT: ${SERVER_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      # JwtProperties record 4번째 필드 매핑 — 본 #462 PR 누락분
      JWT_SESSION_EXPIRATION: ${JWT_SESSION_EXPIRATION}
      # CorsConfig 의 allowed-origin-patterns 매핑 — 본 #462 PR 누락분
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS}
      # LLM 프록시 — dev-bypass 분기는 클라 로그인 완성 시점 후속 티켓에서 제거
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_CONTEXT_PROVIDER: ${LLM_CONTEXT_PROVIDER}
      LLM_SCRIPTED_MODE_ENABLED: ${LLM_SCRIPTED_MODE_ENABLED}
      VLLM_BASE_URL: ${VLLM_BASE_URL}
      VLLM_API_KEY: ${VLLM_API_KEY}
      DEV_BYPASS_ENABLED: ${DEV_BYPASS_ENABLED}
      DEV_BYPASS_SECRET: ${DEV_BYPASS_SECRET}
      # SMTP — 이메일 인증 코드 / 비밀번호 재설정 메일 발송 (Gmail SMTP + 앱 비밀번호)
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TZ: ${TZ}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SERVER_PORT}/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    logging: *default-logging
    networks:
      - backend
      - frontend

  # 자체 Relay (Netty UDP 7777). app 이 빌드한 server-app:latest 이미지 그대로 재사용 +
  # PropertiesLauncher 로 다른 main (RelayApplication) 진입. Dockerfile 변경 X.
  # 호스트 UDP 7777 을 컨테이너가 직접 publish — nginx stream proxy 우회로 cert reload 영향 / 추가 hop 제거.
  relay:
    image: server-app:latest
    restart: unless-stopped
    ports:
      - "7777:7777/udp"
    # JarLauncher 가 manifest 의 ServerApplication 만 띄우므로 -Dloader.main 으로 override.
    entrypoint: ["sh","-c","exec java $$JAVA_OPTS -cp /app -Dloader.main=com.lostmemory.relay.RelayApplication org.springframework.boot.loader.launch.PropertiesLauncher"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      # JwtProperties record 4 필드 모두 요구 — 누락 시 binding fail
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      JWT_SESSION_EXPIRATION: ${JWT_SESSION_EXPIRATION}
      RELAY_PORT: 7777
      RELAY_PEER_IDLE_TIMEOUT_MS: ${RELAY_PEER_IDLE_TIMEOUT_MS}
      RELAY_CLEANUP_INTERVAL_MS: ${RELAY_CLEANUP_INTERVAL_MS}
      HANDSHAKE_TIMEOUT_MS: ${HANDSHAKE_TIMEOUT_MS}
      # LlmProperties binding 위한 envvar — Relay 자체는 LLM 안 쓰지만 JwtAuthenticationFilter bean
      # 생성 시 LlmProperties 가 주입돼야 함 (lesson reference_relay_udp_infra.md).
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_CONTEXT_PROVIDER: ${LLM_CONTEXT_PROVIDER}
      LLM_SCRIPTED_MODE_ENABLED: ${LLM_SCRIPTED_MODE_ENABLED}
      VLLM_BASE_URL: ${VLLM_BASE_URL}
      VLLM_API_KEY: ${VLLM_API_KEY}
      DEV_BYPASS_ENABLED: ${DEV_BYPASS_ENABLED}
      DEV_BYPASS_SECRET: ${DEV_BYPASS_SECRET}
      TZ: ${TZ}
    depends_on:
      app:
        condition: service_started
    healthcheck:
      # Relay 는 HTTP endpoint 없음 — 프로세스 살아있는지만 체크
      test: ["CMD-SHELL", "pgrep -f RelayApplication > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks:
      - frontend

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # Let's Encrypt 인증서 (certbot 으로 발급/갱신, nginx 는 read-only)
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot:ro
    logging: *default-logging
    networks:
      - frontend

  # Let's Encrypt 인증서 발급/갱신 전용 컨테이너.
  # 평소 `docker compose up` 에는 안 뜸 — 첫 발급/갱신 시에만
  #   `docker compose --profile certbot run --rm certbot ...` 로 실행.
  certbot:
    image: certbot/certbot:v2.11.0
    profiles: ["certbot"]
    environment:
      TZ: ${TZ}
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_etc:/etc/letsencrypt
    logging: *default-logging
    networks:
      - frontend

volumes:
  postgres_data:
  redis_data:
  certbot_webroot:
  certbot_etc:

networks:
  backend:
    internal: true   # 외부 차단
  frontend: