# Alertmanager — Prometheus alert → Mattermost incoming webhook 라우팅.
#
# Mattermost incoming webhook 은 Slack-compatible payload 형식을 그대로 받음.
# 따라서 alertmanager 의 slack_configs 가 별도 receiver 구현 없이 동작.
#
# Webhook URL 은 entrypoint sh 가 env → /tmp/secrets/mattermost-webhook-url 파일로 작성.
# 본 YAML 평문에는 URL 미노출 — git diff 에도 안 남음.

route:
  receiver: mattermost
  # alertname 같으면 한 그룹으로 묶음. instance 별로 묶고 싶으면 [alertname, instance].
  group_by: ["alertname"]
  # 첫 alert 도착 후 30s 동안 같은 그룹 alert 모아 한 번에 발송 (블립 묶음 처리).
  group_wait: 30s
  # 같은 그룹 내 새 alert 가 추가될 때 5분 간격으로 batched 발송.
  group_interval: 5m
  # 동일 firing alert 24h 마다 1회만 재발송 — 사용자 정책 "firing 1회 + resolved 1회" 보장.
  repeat_interval: 24h

receivers:
  - name: mattermost
    slack_configs:
      - api_url_file: /tmp/secrets/mattermost-webhook-url
        # firing → resolved 전환 시 RESOLVED 알림 1회 추가 발송 — 사용자 정책 핵심.
        send_resolved: true
        # 채널/유저명은 Mattermost incoming webhook 설정이 우선. 여기 값은 무시되지만 schema 호환용.
        channel: "#alerts"
        username: "Prometheus Alertmanager"
        icon_emoji: ":rotating_light:"
        # 제목: "FIRING: HighCpuUsage" 또는 "RESOLVED: HighDiskUsage"
        title: '{{ .Status | toUpper }}: {{ .GroupLabels.alertname }} ({{ .Alerts.Firing | len }}건)'
        # 본문: 각 alert 의 summary + description + 시각.
        text: |-
          {{ range .Alerts }}
          *{{ .Labels.alertname }}* — {{ .Annotations.summary }}
          {{ .Annotations.description }}
          시작: `{{ .StartsAt.Format "2006-01-02 15:04:05 MST" }}`
          {{ if eq .Status "resolved" }}복구: `{{ .EndsAt.Format "2006-01-02 15:04:05 MST" }}`
          {{ end }}---
          {{ end }}

# inhibit_rules / time_intervals 은 본 PR 범위 밖 — 향후 야간 mute 등 필요 시 추가.
