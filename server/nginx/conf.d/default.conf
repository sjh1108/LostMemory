# =====================================================================
# HTTP 80 — ACME challenge + HTTPS redirect
# =====================================================================
server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name k14c201.p.ssafy.io _;

    # Let's Encrypt HTTP-01 challenge — webroot 공유 볼륨에서 응답
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # nginx self-health — TLS 트러블 시에도 80 으로 alive 확인 가능하도록 redirect 제외
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 그 외 모든 트래픽은 HTTPS 로 강제
    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================================
# HTTPS 443 — 메인 리버스 프록시 (게임 서버 + Jenkins UI)
# =====================================================================
server {
    listen      443 ssl default_server;
    listen      [::]:443 ssl default_server;
    http2       on;
    server_name k14c201.p.ssafy.io;

    # docker embedded DNS — 런타임에 app/jenkins 호스트명 지연 해석
    # (백엔드 컨테이너가 아직 없어도 nginx 기동 가능)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Let's Encrypt 인증서 (named volume certbot_etc 마운트)
    ssl_certificate     /etc/letsencrypt/live/k14c201.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/k14c201.p.ssafy.io/privkey.pem;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HSTS 등 보안 헤더는 시연 안정 후 별도 티켓에서 도입

    # proxy timeouts
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    # 루트 — nginx 자체 placeholder 응답 (리버스 프록시 동작 확인용)
    location = / {
        default_type text/plain;
        return 200 "LostMemory (SSAFY C201) - nginx reverse proxy is up.\n";
    }

    # nginx self-health (모니터링/헬스체크용)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/* → Spring Boot (app:8080) 리버스 프록시
    # variable-based proxy_pass 로 런타임 DNS 해석 → app 없을 때 502 로 graceful fail
    location /api/ {
        set $app_upstream http://app:8080;
        proxy_pass $app_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / HTTP upgrade 대비
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # /jenkins/ → Jenkins UI (jenkins:8080, Jenkins 가 --prefix=/jenkins 로 기동)
    # variable-based proxy_pass 로 jenkins 컨테이너 없어도 nginx 기동 가능
    # 단, 변수 사용 시 URI 자동 전달 X → $request_uri 명시
    # proxy_redirect default 는 변수 proxy_pass 와 호환 X → off 로 설정
    location /jenkins/ {
        set $jenkins_upstream http://jenkins:8080;
        proxy_pass $jenkins_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Jenkins CLI / WebSocket / 대용량 업로드 대비
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 100m;
    }
}
