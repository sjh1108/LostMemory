server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name k14c201.p.ssafy.io _;

    # docker embedded DNS — 런타임에 app 호스트명 지연 해석
    # (app 컨테이너가 아직 없어도 nginx 기동 가능하도록)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # proxy timeouts
    proxy_connect_timeout  10s;
    proxy_send_timeout     30s;
    proxy_read_timeout     30s;

    # 루트 — nginx 자체 placeholder 응답 (리버스 프록시 동작 확인용)
    location = / {
        default_type text/plain;
        return 200 "LostMemory (SSAFY C201) - nginx reverse proxy is up.\n";
    }

    # nginx self-health (모니터링/헬스체크용)
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # /api/* → Spring Boot (app:8080) 리버스 프록시
    # variable-based proxy_pass 로 런타임 DNS 해석 → app 없을 때 502 로 graceful fail
    location /api/ {
        set $app_upstream http://app:8080;
        proxy_pass $app_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # WebSocket / HTTP upgrade 대비
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # /jenkins/ → Jenkins UI (jenkins:8080, Jenkins 가 --prefix=/jenkins 로 기동)
    # variable-based proxy_pass 로 jenkins 컨테이너 없어도 nginx 기동 가능
    # 단, 변수 사용 시 URI 자동 전달 X → $request_uri 명시
    # proxy_redirect default 는 변수 proxy_pass 와 호환 X → off 로 설정
    location /jenkins/ {
        set $jenkins_upstream http://jenkins:8080;
        proxy_pass $jenkins_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Jenkins CLI / WebSocket / 대용량 업로드 대비
        proxy_request_buffering off;
        proxy_buffering off;
        client_max_body_size 100m;
    }
}
