user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

# UDP 7777 — 자체 Relay 외부 진입점.
# nginx:alpine 의 stream 모듈 기본 컴파일됨 (별도 설치 X).
stream {
    # docker embedded DNS 로 런타임 relay:7777 해석 — relay 컨테이너 미기동 시에도 nginx 기동 가능
    server {
        listen 7777 udp reuseport;
        proxy_pass relay:7777;
        # UDP 는 connection 개념 약함 — 게임 세션 전체 동안 timeout 길게
        proxy_timeout 600s;
        proxy_responses 0;            # UDP 응답 카운트 무시 (양방향 중계 패턴)
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server_tokens off;

    # gzip
    gzip  on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # client-side timeouts
    client_body_timeout     30s;
    client_header_timeout   30s;
    send_timeout            30s;

    include /etc/nginx/conf.d/*.conf;
}