spring:
  application:
    name: server
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api   # 모든 endpoint 가 /api/* 로 서빙 — nginx /api/ 프록시와 경로 일치

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  session-expiration: ${JWT_SESSION_EXPIRATION}   # 자체 Relay 입장용 단명 토큰 (초). 기본 10분

# 자체 Relay 서버 (RelayApplication 으로 기동될 때만 사용. ServerApplication 에서는 무관)
relay:
  port: ${RELAY_PORT:7777}
  handshake-timeout-ms: ${HANDSHAKE_TIMEOUT_MS}  # UDP 통신 핸드셰이크 타임아웃 (밀리초)
  peer-idle-timeout-ms: ${RELAY_PEER_IDLE_TIMEOUT_MS:10000}  # peer 가 이 시간 이상 패킷 미수신 시 dead 처리 (BYE 누락 fallback)
  cleanup-interval-ms: ${RELAY_CLEANUP_INTERVAL_MS:2000}     # idle peer cleanup 주기 — peer-idle-timeout-ms 보다 짧게

# CORS — Unity WebGL / Swagger 외부 호출 등에서 origin 검사 통과용
# 콤마 구분 패턴. dev 는 "*", prod 는 도메인 화이트리스트
app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS}